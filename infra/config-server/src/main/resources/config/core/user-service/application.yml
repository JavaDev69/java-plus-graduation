server:
  port: ${APP_PORT:9292}

spring:
  application:
    name: user-service
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5431/ewm_db}
    username: ${DATASOURCE_USERNAME:dbuser}
    password: ${DATASOURCE_PASSWORD:12345}

logging:
  level:
    com.fasterxml.jackson: DEBUG
    org.springframework.web: DEBUG
    ru.practicum: DEBUG