server:
  port: 0

spring:
  application:
    name: stats-server
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/stats_db}
    username: ${DATASOURCE_USERNAME:dbuser}
    password: ${DATASOURCE_PASSWORD:12345}

logging:
  level:
    org.springframework: ERROR
    ru.practicum: DEBUG