server:
  port: 8080

spring:
  application:
    name: main-server
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5431/ewm_db}
    username: ${DATASOURCE_USERNAME:dbuser}
    password: ${DATASOURCE_PASSWORD:12345}

stats:
  server:
    url: ${STATS_SERVER_URL:http://localhost:8081}


eureka:
  instance:
    instance-id: ${spring.application.name}:${random.value}
  client:
    service-url:
      defaultZone: http://${EUREKA_HOSTNAME:localhost}:${EUREKA_PORT:8761}/eureka/

logging:
  level:
    com.fasterxml.jackson: DEBUG
    org.springframework.web: DEBUG
