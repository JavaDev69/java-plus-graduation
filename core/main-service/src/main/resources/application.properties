server.port=8080
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.sql.init.mode=always
spring.main.allow-bean-definition-overriding=false
# PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DATASOURCE_URL:jdbc:postgresql://localhost:5432/ewm_db}
spring.datasource.username=${DATASOURCE_USERNAME:dbuser}
spring.datasource.password=${DATASOURCE_PASSWORD:12345}
stats.server.url=${STATS_SERVER_URL:http://localhost:8081}

logging.level.com.fasterxml.jackson=DEBUG
logging.level.org.springframework.web=DEBUG
