services:
  stats-server:
    build: ./stats/stats-service
    environment:
      DATASOURCE_URL: jdbc:postgresql://stats-db:5432/stats_db
      DATASOURCE_USERNAME: dbuser
      DATASOURCE_PASSWORD: 12345
    ports:
      - "9090:9090"
    depends_on:
      stats-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9090/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ewm-net

  ewm-service:
    build: ./core/main-service
    environment:
      DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_db
      DATASOURCE_USERNAME: dbuser
      DATASOURCE_PASSWORD: 12345
      STATS_SERVER_URL: http://stats-server:9090
    ports:
      - "8080:8080"
    depends_on:
      ewm-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ewm-net

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    hostname: ewm-db
    environment:
      POSTGRES_DB: ewm_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    ports:
      - "5431:5432"
    healthcheck:
      test: pg_isready -q -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"
      timeout: 5s
      interval: 5s
      retries: 10
    networks:
      - ewm-net

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    hostname: stats-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stats_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    healthcheck:
      test: pg_isready -q -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"
      timeout: 5s
      interval: 5s
      retries: 10
    networks:
      - ewm-net

networks:
  ewm-net:
    driver: bridge