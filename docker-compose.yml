services:
  kafka:
    image: confluentinc/confluent-local:7.4.3
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092" # for client connections
      - "9101:9101" # JMX
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: localhost
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      CLUSTER_ID: 'K0EA9p0yEe6MkAAAAkKsEg'
    networks:
      - ewm-net

  kafka-init-topics:
    image: confluentinc/confluent-local:7.4.3
    container_name: kafka-init-topics
    depends_on:
      - kafka
    command: "bash -c \
                'kafka-topics --create --topic stats.user-actions.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092 && \
                kafka-topics --create --topic stats.events-similarity.v1 \
                             --partitions 1 --replication-factor 1 --if-not-exists \
                             --bootstrap-server kafka:29092'"
    init: true
    networks:
      - ewm-net

  discovery-server:
    build: ./infra/discovery-server
    ports:
      - "8761:8761"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8761/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - ewm-net

  config-server:
    build: ./infra/config-server
    environment:
      EUREKA_HOSTNAME: discovery-server
      EUREKA_PORT: 8761
      CONFIG_PORT: 8888
    ports:
      - "8888:8888"
    depends_on:
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 24h
      start_period: 10s
      start_interval: 10s
    networks:
      - ewm-net

  gateway-server:
    build: ./infra/gateway-server
    ports:
      - "8080:8080"
      - "9090:8080"
    environment:
      EUREKA_HOSTNAME: discovery-server
      EUREKA_PORT: 8761
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ewm-net

  collector:
    build: ./stats/collector
    environment:
      APP_PORT: 0
      BOOTSTRAP_SERVER: kafka:9092
      EUREKA_HOSTNAME: discovery-server
      EUREKA_PORT: 8761
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 24h
      start_period: 10s
      start_interval: 10s
    restart: unless-stopped
    networks:
      - ewm-net

  analyzer:
    build: ./stats/analyzer
    environment:
      APP_PORT: 0
      BOOTSTRAP_SERVER: kafka:9092
      EUREKA_HOSTNAME: discovery-server
      EUREKA_PORT: 8761
    depends_on:
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
      stats-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "true" ]
      interval: 24h
      start_period: 10s
      start_interval: 10s
    restart: unless-stopped
    networks:
      - ewm-net

  user-service:
    build: ./core/user-service
    environment:
      APP_PORT: 0
      DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_db
      DATASOURCE_USERNAME: dbuser
      DATASOURCE_PASSWORD: 12345
      STATS_SERVER_URL: http://stats-server:9090
      EUREKA_HOSTNAME: discovery-server
      EUREKA_PORT: 8761
    depends_on:
      ewm-db:
        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ewm-net

  request-service:
    build: ./core/request-service
    environment:
      APP_PORT: 0
      DATASOURCE_URL: jdbc:postgresql://ewm-db:5432/ewm_db
      DATASOURCE_USERNAME: dbuser
