        condition: service_healthy
      config-server:
        condition: service_healthy
      discovery-server:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ewm-net

  ewm-db:
    image: postgres:16.1
    container_name: ewm-db
    hostname: ewm-db
    environment:
      POSTGRES_DB: ewm_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    healthcheck:
      test: pg_isready -q -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"
      timeout: 5s
      interval: 5s
      retries: 10
    depends_on:
      config-server:
        condition: service_started
    networks:
      - ewm-net

  stats-db:
    image: postgres:16.1
    container_name: stats-db
    hostname: stats-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: stats_db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: 12345
    healthcheck:
      test: pg_isready -q -d "$$POSTGRES_DB" -U "$$POSTGRES_USER"
      timeout: 5s
      interval: 5s
      retries: 10
    networks:
      - ewm-net

networks:
  ewm-net:
    driver: bridge