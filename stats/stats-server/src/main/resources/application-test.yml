# H2
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  h2:
    console:
      enabled: true

# log
logging:
  level:
    ru.practicum: DEBUG
    org.springframework.validation: TRACE
    org.hibernate: DEBUG
