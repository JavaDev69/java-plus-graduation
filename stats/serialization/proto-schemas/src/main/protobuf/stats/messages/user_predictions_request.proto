syntax = "proto3";

package stats.message;

option java_package = "ru.practicum.ewm.stats.proto";
option java_multiple_files = true;

// запрос на получение рекомендуемых мероприятий для пользователя
message UserRecommendationsRequestProto {
  int64 user_id = 1;
  sint32 max_results = 2; // Ограничение количества мероприятий в результате выполнения запроса
}